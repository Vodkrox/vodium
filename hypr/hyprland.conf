source = local.conf

input {
    touchpad {
        tap-to-click = true
        natural_scroll = true
    }
}

general {
    gaps_in = 4
    gaps_out = 2
    border_size = 2
    col.active_border = rgb(ffffff)
    col.inactive_border = rgb(2a2a2a)
    layout = dwindle
}

animations {
    enabled = yes
    animation = windowsIn, 1, 4, default
    animation = windowsOut, 1, 0.8, linear, slide bottom
    animation = workspaces, 1, 3, default
}

decoration {
    rounding = 10
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = 0x000000
}

dwindle {
    preserve_split = true
}

workspace = 1, persistent:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true
workspace = 6, persistent:true
workspace = 7, persistent:true
workspace = 8, persistent:true
workspace = 9, persistent:true

exec-once = $qs
exec-once = awww-daemon -q
exec-once = $autoOutput

$mainMod = SUPER

bind = $mainMod, Q, exec, $qs ipc call launcher toggle
bind = $mainMod, B, exec, $qs ipc call clipboard toggle
bind = $mainMod, T, exec, $qs ipc call tray toggle
bind = $mainMod, L, exec, $lock
bind = $mainMod, Return, exec, $terminal

bind = $mainMod, N, exec, $qs ipc call notifications press
bind = $mainMod, W, killactive,
bind = $mainMod, F, fullscreen, 1
bind = $mainMod, left, movewindow, l
bind = $mainMod, right, movewindow, r
bind = $mainMod, V, togglefloating,
bind = $mainMod, M, exit,

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, workspace, e-1
bind = $mainMod SHIFT, 9, workspace, e+1

bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind = , XF86Calculator, exec, $calculator

bindle = , XF86MonBrightnessUp,   exec, brightnessctl -n1 set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl -n1 set 5%-

source = numpad-binds.conf
